# ============================================
# TEST CONFIGURATION - H2 In-Memory Database
# ============================================

# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT (test secret)
jwt.secret=TestSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong!
jwt.expiration=3600000

# Cloudinary (mock values for tests)
cloudinary.cloud_name=test
cloudinary.api_key=test
cloudinary.api_secret=test

# Mailgun (disabled for tests)
mailgun.enabled=false
mailgun.api-key=test-api-key
mailgun.domain=test.mailgun.org
mailgun.from-email=test@test.com
mailgun.from-name=Test Cinema

# Disable DataLoader in tests
spring.main.allow-bean-definition-overriding=true
